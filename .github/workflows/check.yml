name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Bootstrap verified audio tools
        run: ./scripts/bootstrap-audio-tools.sh --prefix "$RUNNER_TEMP/daemonv12-audio-tools"
      - name: Check with verified audio tools
        run: |
          source "$RUNNER_TEMP/daemonv12-audio-tools/env.sh"
          npm run check
      - name: Python for CPU proof regression tests
        if: matrix.node == '22.18.0'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: CPU proof regression tests (synthetic media, no production rendering)
        if: matrix.node == '22.18.0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -c "from pathlib import Path; p=Path('tools/angeles2099_actions/requirements.lock'); Path('work').mkdir(exist_ok=True); Path('work/numpy.lock').write_text(next(s for s in p.read_text().splitlines() if s.startswith('numpy=='))+'\n')"
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r work/numpy.lock
          python -m unittest discover -s tools/angeles2099_actions/tests -v
      - name: Sample audio and MCP without system audio tools
        run: npm run smoke -- --mcp
        env:
          DAEMONV12_FLUIDSYNTH: /daemonv12-unavailable/fluidsynth
          DAEMONV12_SOUNDFONT: /daemonv12-unavailable/FluidR3_GM.sf2
          DAEMONV12_FFMPEG: /daemonv12-unavailable/ffmpeg

  # Release gate: pack exactly what npm would publish, install only that tarball into an
  # empty directory, and prove both executables, a Node-only render and nine MCP tools
  # work without the source checkout. Audio tools are hidden; full audio is verified by
  # the manual "Full audio verification" workflow.
  package:
    name: Package clean room (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22.18.0' }
          - { os: ubuntu-24.04, node: '24' }
          - { os: macos-14, node: '24' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:package
        env:
          DAEMONV12_FLUIDSYNTH: /daemonv12-unavailable/fluidsynth
          DAEMONV12_SOUNDFONT: /daemonv12-unavailable/FluidR3_GM.sf2
          DAEMONV12_FFMPEG: /daemonv12-unavailable/ffmpeg
