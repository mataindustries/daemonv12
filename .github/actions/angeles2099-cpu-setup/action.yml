name: Approved CPU proof environment
description: Install the unchanged production pins and verify the native CPU environment
inputs:
  out:
    description: Output directory for environment evidence
    required: true
runs:
  using: composite
  steps:
    - name: Check out immutable production
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: mataindustries/daemonv12
        ref: 2a3208d3679a32e9f5ced303d6bc8baa1a237071
        path: approved-source
        sparse-checkout: productions/lowrider-2099
        persist-credentials: false
    - name: Install exact Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11.14'
        architecture: x64
    - name: Validate original production inputs
      shell: bash
      env:
        PROOF_OUT: ${{ inputs.out }}
      run: |
        mkdir -p "$PROOF_OUT"
        python tools/angeles2099_actions/gate_a.py preflight --source approved-source --out "$PROOF_OUT"
    - name: Install system libraries and FFmpeg
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
    - name: Download verified wheels and install offline
      shell: bash
      env:
        PROOF_OUT: ${{ inputs.out }}
      run: |
        python -m pip download --only-binary=:all: --no-deps --require-hashes -r tools/angeles2099_actions/requirements.lock -d "$RUNNER_TEMP/bpy-wheels"
        python tools/angeles2099_actions/gate_a.py wheels --source approved-source --wheel-dir "$RUNNER_TEMP/bpy-wheels"
        python -m pip install --no-index --find-links "$RUNNER_TEMP/bpy-wheels" --require-hashes -r tools/angeles2099_actions/requirements.lock
        python tools/angeles2099_actions/verify_install.py --source approved-source --wheel-dir "$RUNNER_TEMP/bpy-wheels" --out "$PROOF_OUT/install-check.json"
